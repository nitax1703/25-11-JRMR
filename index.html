<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños - Nivel 22</title>
    <link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
    /* Transición Motos TRON */
#transicion-tron { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5, 10, 15, 0.92); z-index: 9999; pointer-events: none; overflow: hidden; }
.estela-tron { position: absolute; height: 6px; width: 150%; border-radius: 3px; opacity: 0; }
.moto-azul { top: 38%; left: -150%; background: linear-gradient(90deg, transparent, #00f3ff, #fff); box-shadow: 0 0 25px #00f3ff; animation: cruzarDer 0.9s ease-out forwards; }
.moto-naranja { top: 62%; right: -150%; background: linear-gradient(-90deg, transparent, #ff5500, #fff); box-shadow: 0 0 25px #ff5500; animation: cruzarIzq 0.9s ease-out 0.1s forwards; }
@keyframes cruzarDer { 0% { left: -150%; opacity: 1; } 100% { left: 100%; opacity: 0; } }
@keyframes cruzarIzq { 0% { right: -150%; opacity: 1; } 100% { right: 100%; opacity: 0; } }

/* Página 3: Marco Reus (2/5 Izquierda) */
.pantalla-3 { width: 100vw; min-height: 100vh; padding: 40px 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 40px; animation: aparecer 0.8s ease-out; }
.zona-reus { flex: 0 0 40%; max-width: 40%; display: flex; justify-content: center; }
.imagen-reus { width: 100%; max-height: 75vh; object-fit: contain; filter: drop-shadow(0 0 20px rgba(253, 225, 0, 0.35)); }
.zona-info-3 { flex: 1; text-align: left; }
.titulo-dortmund { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #fde100; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 2px; }
.texto-dedicatoria { font-size: 1.05rem; line-height: 1.6; color: #ddd; margin-bottom: 20px; }
.grid-gustos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px; margin-bottom: 20px; }
.tarjeta-gusto { background: #141414; border: 1px solid #2a2a2a; border-left: 3px solid #fde100; padding: 15px; border-radius: 8px; }
.tarjeta-gusto h4 { margin: 0 0 5px 0; color: #fde100; font-size: 0.95rem; }
.tarjeta-gusto p { margin: 0; font-size: 0.85rem; color: #bbb; }
.imagen-corvette-mini { width: 180px; height: auto; mix-blend-mode: screen; }
.botones-navegacion { display: flex; gap: 15px; margin-top: 20px; }
.btn-nav { font-family: 'Orbitron', sans-serif; background: transparent; color: #fff; border: 1px solid #555; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
.btn-nav:hover { border-color: #fde100; color: #fde100; }
@media (max-width: 768px) { .pantalla-3 { flex-direction: column; } .zona-reus { max-width: 70%; } }
    
        /* Configuración general */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .oculto {
            display: none !important;
        }

        /* =========================================
           ESTILOS DE LA PÁGINA 1 (PORTADA)
        ========================================= */
        .portada {
            text-align: center;
            position: relative;
            max-width: 400px;
            padding: 20px;
        }

        .portada h1 {
            font-family: 'Orbitron', sans-serif;
text-transform: uppercase;
text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
            font-size: 2.8rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .fecha {
            font-size: 1rem;
            color: #ff4a75;
            display: inline-block;
            vertical-align: super;
            margin-left: 5px;
        }

        .zona-regalo {
            position: relative;
            margin: 50px auto;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lazo {
            font-size: 5.5rem;
            user-select: none;
            animation: flotar 2s ease-in-out infinite;
        }

        .adorno {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .adorno.corazon1 { top: 10px; left: -20px; animation: flotarSuave 3s ease-in-out infinite alternate; }
        .adorno.estrella1 { top: 20px; right: -20px; animation: flotarSuave 2.5s ease-in-out infinite alternate; }
        .adorno.corazon2 { bottom: 20px; right: -10px; animation: flotarSuave 3.5s ease-in-out infinite alternate; }
        .adorno.estrella2 { bottom: 10px; left: -10px; animation: flotarSuave 2.8s ease-in-out infinite alternate; }

        .boton-continuar {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            animation: latido 1.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .boton-continuar:hover {
            background-color: #ffffff;
            color: #0b0b0b;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* =========================================
           ESTILOS DE LA PÁGINA 2 (RAYO COMPLETO + ÍNDICE EN ZONA NEGRA)
        ========================================= */
        .pantalla-2 {
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 40px 50px;
            box-sizing: border-box;
            background-color: #000000;
            /* rayo */
            background-image: url('pista.png');
            background-size: cover;
            background-position: right bottom;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            animation: aparecer 0.8s ease-out;
        }

        .titulo-nivel {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            width: 100%;
            text-align: center;
            margin: 0 0 50px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #ffccd5, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 0, 51, 0.5));
            z-index: 2;
        }
        

        /* Índice ubicado en la zona negra libre de la izquierda */
        .columna-indice {
            text-align: left;
            padding-left: 20px;
            z-index: 2;
        }

        .columna-indice h3 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .lista-contenido {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lista-contenido li {
            font-size: 1.2rem;
            margin-bottom: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cccccc;
            transition: color 0.3s ease;
        }

        .lista-contenido li::before {
            content: "•";
            color: #ffffff;
            font-size: 1.5rem;
        }

        /* Bobbing effect al pasar el cursor o seleccionar */
        .lista-contenido li:hover, .lista-contenido li.seleccionado {
            color: #ffffff;
            font-weight: bold;
            animation: flotar 1s ease-in-out infinite;
        }

        /* =========================================
           ANIMACIONES
        ========================================= */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.08); }
            70% { transform: scale(1); }
        }

        @keyframes flotarSuave {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(5deg); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ================= PÁGINA 1: PORTADA ================= -->
    <div id="pagina1" class="portada">
        <h1>Happy Birthday <span class="fecha">25/11 ❤️</span></h1>
        
        <div class="zona-regalo">
            <span class="adorno corazon1">❤️</span>
            <span class="adorno estrella1">⭐</span>
            <div class="lazo">🎀</div>
            <span class="adorno corazon2">❤️</span>
            <span class="adorno estrella2">⭐</span>
        </div>

        <button class="boton-continuar" onclick="irAPagina2()">CONTINUE</button>
    </div>

    <!-- ================= PÁGINA 2: NIVEL 22 ================= -->
    <div id="pagina2" class="pantalla-2 oculto">
        <h2 class="titulo-nivel">¡Felicidades haz alcanzado el NIVEL 22!</h2>

        <!-- Índice posicionado en el espacio negro superior izquierdo -->
        <div class="columna-indice">
            <h3>CONTENIDO</h3>
            <ul class="lista-contenido">
                <li onclick="seleccionarOpcion(this, 3)">Página 3</li>
                <li onclick="seleccionarOpcion(this, 4)">Página 4</li>
                <li onclick="seleccionarOpcion(this, 5)">Página 5</li>
                <li onclick="seleccionarOpcion(this, 6)">Página 6</li>
                <li onclick="seleccionarOpcion(this, 7)">Página 7</li>
            </ul>
        </div>
    </div>

    <!-- ================= LÓGICA EN JAVASCRIPT ================= -->
    <script>
        function irAPagina2() {
            document.getElementById('pagina1').classList.add('oculto');
            document.getElementById('pagina2').classList.remove('oculto');
        }

        function seleccionarOpcion(elementoClicado, numeroPagina) {
            const todasLasOpciones = document.querySelectorAll('.lista-contenido li');
            
            todasLasOpciones.forEach(function(item) {
                item.classList.remove('seleccionado');
            });

            elementoClicado.classList.add('seleccionado');

            setTimeout(function() {
                alert("¡Aquí cruzarán las motos de TRON hacia la Página " + numeroPagina + "!");
            }, 900);
        }
        <!-- Página 3: Exclusiva de Marco Reus -->
<div id="pagina3" class="pantalla-3 oculto">
    <div class="zona-reus">
        <img src="reus.png" alt="Marco Reus" class="imagen-reus">
    </div>
    <div class="zona-info-3">
        <h2 class="titulo-dortmund">11. Mi Jugador Estrella</h2>
        <p class="texto-dedicatoria">
            Así como Marco Reus representa lealtad, talento puro y nunca rendirse sin importar los obstáculos, 
            admiro todo lo que eres y todo lo que construyes cada día. ¡Feliz vuelta al sol, mi #11 favorito!
        </p>
        <div class="grid-gustos">
            <div class="tarjeta-gusto">
                <h4>💛 Lealtad Infinita</h4>
                <p>Fiel a sus colores y a lo que ama, pase lo que pase.</p>
            </div>
            <div class="tarjeta-gusto">
                <h4>⚽ Magia en la Cancha</h4>
                <p>Visión de juego, elegancia y entrega total en cada minuto.</p>
            </div>
            <div class="tarjeta-gusto">
                <h4>🏆 Espíritu de Capitán</h4>
                <p>Liderazgo real y ejemplo dentro y fuera del campo.</p>
            </div>
        </div>
        <div class="botones-navegacion">
            <button class="btn-nav" onclick="mostrarPantalla('pagina2')">⬅ Índice</button>
            <button class="btn-nav" onclick="alert('Siguiente: Página 4')">Siguiente ➔</button>
        </div>
    </div>
</div>

<!-- Capa de transición TRON -->
<div id="transicion-tron" class="oculto">
    <div class="estela-tron moto-azul"></div>
    <div class="estela-tron moto-naranja"></div>
</div>

<script>
    function irAPagina2() {
        mostrarPantalla('pagina2');
    }

    function mostrarPantalla(idDestino) {
        ['pagina1', 'pagina2', 'pagina3'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.add('oculto');
        });
        const destino = document.getElementById(idDestino);
        if (destino) destino.classList.remove('oculto');
    }

    function seleccionarOpcion(elemento, numeroPagina) {
        document.querySelectorAll('.lista-contenido li').forEach(li => li.classList.remove('seleccionado'));
        elemento.classList.add('seleccionado');

        setTimeout(() => {
            const tron = document.getElementById('transicion-tron');
            if (tron) tron.classList.remove('oculto');
            setTimeout(() => {
                mostrarPantalla('pagina' + numeroPagina);
                if (tron) tron.classList.add('oculto');
            }, 850);
        }, 500);
    }
</script>
</body>
</html>
