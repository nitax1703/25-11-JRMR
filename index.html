<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños - Nivel 22</title>
    <link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Configuración general */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .oculto {
            display: none !important;
        }

        /* =========================================
           ESTILOS DE LA PÁGINA 1 (PORTADA)
        ========================================= */
        .portada {
            text-align: center;
            position: relative;
            max-width: 400px;
            padding: 20px;
        }

        .portada h1 {
            font-family: 'Orbitron', sans-serif;
text-transform: uppercase;
text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
            font-size: 2.8rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .fecha {
            font-size: 1rem;
            color: #ff4a75;
            display: inline-block;
            vertical-align: super;
            margin-left: 5px;
        }

        .zona-regalo {
            position: relative;
            margin: 50px auto;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lazo {
            font-size: 5.5rem;
            user-select: none;
            animation: flotar 2s ease-in-out infinite;
        }

        .adorno {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .adorno.corazon1 { top: 10px; left: -20px; animation: flotarSuave 3s ease-in-out infinite alternate; }
        .adorno.estrella1 { top: 20px; right: -20px; animation: flotarSuave 2.5s ease-in-out infinite alternate; }
        .adorno.corazon2 { bottom: 20px; right: -10px; animation: flotarSuave 3.5s ease-in-out infinite alternate; }
        .adorno.estrella2 { bottom: 10px; left: -10px; animation: flotarSuave 2.8s ease-in-out infinite alternate; }

        .boton-continuar {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            animation: latido 1.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .boton-continuar:hover {
            background-color: #ffffff;
            color: #0b0b0b;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* =========================================
           ESTILOS DE LA PÁGINA 2 (RAYO COMPLETO + ÍNDICE EN ZONA NEGRA)
        ========================================= */
        .pantalla-2 {
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 40px 50px;
            box-sizing: border-box;
            background-color: #000000;
            /* rayo */
            background-image: url('pista.png');
            background-size: 67% auto;
            background-position: right bottom;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            animation: aparecer 0.8s ease-out;
        }

        .titulo-nivel {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            width: 100%;
            text-align: center;
            margin: 0 0 50px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #ffccd5, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 0, 51, 0.5));
            z-index: 2;
        }
        

        /* Índice ubicado en la zona negra libre de la izquierda */
        .columna-indice {
            text-align: left;
            padding-left: 20px;
            z-index: 2;
        }

        .columna-indice h3 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .lista-contenido {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lista-contenido li {
            font-size: 1.2rem;
            margin-bottom: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cccccc;
            transition: color 0.3s ease;
        }

        .lista-contenido li::before {
            content: "•";
            color: #ffffff;
            font-size: 1.5rem;
        }

        /* Bobbing effect al pasar el cursor o seleccionar */
        .lista-contenido li:hover, .lista-contenido li.seleccionado {
            color: #ffffff;
            font-weight: bold;
            animation: flotar 1s ease-in-out infinite;
        }

        /* =========================================
           ANIMACIONES
        ========================================= */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.08); }
            70% { transform: scale(1); }
        }

        @keyframes flotarSuave {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(5deg); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ================= PÁGINA 1: PORTADA ================= -->
    <div id="pagina1" class="portada">
        <h1>Happy Birthday <span class="fecha">25/11 ❤️</span></h1>
        
        <div class="zona-regalo">
            <span class="adorno corazon1">❤️</span>
            <span class="adorno estrella1">⭐</span>
            <div class="lazo">🎀</div>
            <span class="adorno corazon2">❤️</span>
            <span class="adorno estrella2">⭐</span>
        </div>

        <button class="boton-continuar" onclick="irAPagina2()">CONTINUE</button>
    </div>

    <!-- ================= PÁGINA 2: NIVEL 22 ================= -->
    <div id="pagina2" class="pantalla-2 oculto">
        <h2 class="titulo-nivel">¡Felicidades haz alcanzado el NIVEL 22!</h2>

        <!-- Índice posicionado en el espacio negro superior izquierdo -->
        <div class="columna-indice">
            <h3>CONTENIDO</h3>
            <ul class="lista-contenido">
                <li onclick="seleccionarOpcion(this, 3)">Página 3</li>
                <li onclick="seleccionarOpcion(this, 4)">Página 4</li>
                <li onclick="seleccionarOpcion(this, 5)">Página 5</li>
                <li onclick="seleccionarOpcion(this, 6)">Página 6</li>
                <li onclick="seleccionarOpcion(this, 7)">Página 7</li>
            </ul>
        </div>
    </div>

    <!-- ================= LÓGICA EN JAVASCRIPT ================= -->
    <script>
        function irAPagina2() {
            document.getElementById('pagina1').classList.add('oculto');
            document.getElementById('pagina2').classList.remove('oculto');
        }

        function seleccionarOpcion(elementoClicado, numeroPagina) {
            const todasLasOpciones = document.querySelectorAll('.lista-contenido li');
            
            todasLasOpciones.forEach(function(item) {
                item.classList.remove('seleccionado');
            });

            elementoClicado.classList.add('seleccionado');

            setTimeout(function() {
                alert("¡Aquí cruzarán las motos de TRON hacia la Página " + numeroPagina + "!");
            }, 900);
        }
    </script>
</body>
</html>
