<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños - Nivel 22</title>
    <style>
        /* Configuración general de toda la página */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Clase auxiliar para ocultar las pantallas que no están activas */
        .oculto {
            display: none !important;
        }

        /* =========================================
           ESTILOS DE LA PÁGINA 1 (PORTADA)
        ========================================= */
        .portada {
            text-align: center;
            position: relative;
            max-width: 400px;
            padding: 20px;
        }

        .portada h1 {
            font-size: 2.8rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .fecha {
            font-size: 1rem;
            color: #ff4a75;
            display: inline-block;
            vertical-align: super;
            margin-left: 5px;
        }

        .zona-regalo {
            position: relative;
            margin: 50px auto;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caja-regalo {
            font-size: 5.5rem;
            user-select: none;
            animation: flotar 2s ease-in-out infinite;
        }

        .adorno {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .adorno.corazon1 { top: 10px; left: -20px; animation: flotarSuave 3s ease-in-out infinite alternate; }
        .adorno.estrella1 { top: 20px; right: -20px; animation: flotarSuave 2.5s ease-in-out infinite alternate; }
        .adorno.corazon2 { bottom: 20px; right: -10px; animation: flotarSuave 3.5s ease-in-out infinite alternate; }
        .adorno.estrella2 { bottom: 10px; left: -10px; animation: flotarSuave 2.8s ease-in-out infinite alternate; }

        .boton-continuar {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            animation: latido 1.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .boton-continuar:hover {
            background-color: #ffffff;
            color: #0b0b0b;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* =========================================
           ESTILOS DE LA PÁGINA 2 (BOCETO LIBRETA)
        ========================================= */
        .pantalla-2 {
            width: 100%;
            max-width: 1050px;
            min-height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            animation: aparecer 0.8s ease-out;
        }

        .titulo-nivel {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .estructura-boceto {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 20px;
            flex-wrap: wrap;
        }

        .columna-auto, .columna-pista {
            flex: 1;
            min-width: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hace transparente el fondo negro de tus imágenes neón */
        .imagen-neon {
            width: 100%;
            max-width: 340px;
            height: auto;
            mix-blend-mode: screen;
        }

        .columna-indice {
            flex: 1;
            min-width: 220px;
            text-align: left;
            padding: 0 15px;
        }

        .columna-indice h3 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .lista-contenido {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lista-contenido li {
            font-size: 1.15rem;
            margin-bottom: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #bbbbbb;
            transition: color 0.3s ease;
        }

        .lista-contenido li::before {
            content: "•";
            color: #ffffff;
            font-size: 1.5rem;
        }

        /* Bobbing effect al pasar el cursor o seleccionar */
        .lista-contenido li:hover, .lista-contenido li.seleccionado {
            color: #ffffff;
            font-weight: bold;
            animation: flotar 1s ease-in-out infinite;
        }

        /* =========================================
           ANIMACIONES (KEYFRAMES)
        ========================================= */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes latido {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.08); }
            70% { transform: scale(1); }
        }

        @keyframes flotarSuave {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(5deg); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ================= PÁGINA 1: PORTADA ================= -->
    <div id="pagina1" class="portada">
        <h1>Happy Birthday <span class="fecha">25/11 ❤️</span></h1>
        
        <div class="zona-regalo">
            <span class="adorno corazon1">❤️</span>
            <span class="adorno estrella1">⭐</span>
            <div class="caja-regalo">🎁</div>
            <span class="adorno corazon2">❤️</span>
            <span class="adorno estrella2">⭐</span>
        </div>

        <button class="boton-continuar" onclick="irAPagina2()">CONTINUE</button>
    </div>

    <!-- ================= PÁGINA 2: NIVEL 22 ================= -->
    <div id="pagina2" class="pantalla-2 oculto">
        <h2 class="titulo-nivel">¡Felicidades haz alcanzado el NIVEL 22!</h2>

        <div class="estructura-boceto">
            <!-- Izquierda: Corvette C6 Neón -->
            <div class="columna-auto">
                <img src="c6.png" alt="Corvette C6" class="imagen-neon">
            </div>

            <!-- Centro: Índice -->
            <div class="columna-indice">
                <h3>CONTENIDO</h3>
                <ul class="lista-contenido">
                    <li onclick="seleccionarOpcion(this, 3)">Página 3</li>
                    <li onclick="seleccionarOpcion(this, 4)">Página 4</li>
                    <li onclick="seleccionarOpcion(this, 5)">Página 5</li>
                    <li onclick="seleccionarOpcion(this, 6)">Página 6</li>
                    <li onclick="seleccionarOpcion(this, 7)">Página 7</li>
                </ul>
            </div>

            <!-- Derecha: Pista Speed Racer Neón -->
            <div class="columna-pista">
                <img src="pista.png" alt="Pista Speed Racer" class="imagen-neon">
            </div>
        </div>

        <div style="height: 20px;"></div>
    </div>

    <!-- ================= LÓGICA EN JAVASCRIPT ================= -->
    <script>
        // Función 1: Cambia de la portada a la pantalla del Nivel 22
        function irAPagina2() {
            document.getElementById('pagina1').classList.add('oculto');
            document.getElementById('pagina2').classList.remove('oculto');
        }

        // Función 2: Activa el efecto flotante en la opción elegida y prepara el cambio
        function seleccionarOpcion(elementoClicado, numeroPagina) {
            const todasLasOpciones = document.querySelectorAll('.lista-contenido li');
            
            todasLasOpciones.forEach(function(item) {
                item.classList.remove('seleccionado');
            });

            elementoClicado.classList.add('seleccionado');

            setTimeout(function() {
                alert("¡Aquí cruzarán las motos de TRON hacia la Página " + numeroPagina + "!");
            }, 900);
        }
    </script>
</body>
</html>
